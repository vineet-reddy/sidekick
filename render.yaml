services:
  - type: web
    name: sidekick-github-bootstrap
    runtime: docker
    plan: starter
    dockerfilePath: ./github_bootstrap_service/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SIDEKICK_BACKEND_BASE_URL
        value: https://sidekick-ion1.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: SIDEKICK_ENCRYPTION_SECRET
        sync: false

      <line x1="-50" y1="60" x2="40" y2="145" stroke="#3b5bdb" stroke-width="5.5" opacity="0.32"/>
      <line x1="40" y1="145" x2="90" y2="78" stroke="#3b5bdb" stroke-width="5.5" opacity="0.32"/>
      <line x1="-50" y1="60" x2="-108" y2="145" stroke="#3b5bdb" stroke-width="5.5" opacity="0.32"/>
      <line x1="-108" y1="145" x2="40" y2="145" stroke="#3b5bdb" stroke-width="4.5" opacity="0.25"/>
      <line x1="40" y1="145" x2="-24" y2="195" stroke="#3b5bdb" stroke-width="4.5" opacity="0.25"/>
      <line x1="-50" y1="60" x2="18" y2="20" stroke="#3b5bdb" stroke-width="4.5" opacity="0.25"/>
      <line x1="90" y1="78" x2="18" y2="20" stroke="#3b5bdb" stroke-width="4" opacity="0.20"/>
